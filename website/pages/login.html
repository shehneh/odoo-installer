<!-- LOGIN PAGE PARTIAL -->
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <div class="logo-icon">🚀</div>
                <h1>OdooMaster</h1>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">ورود</button>
                <button class="tab-btn" data-tab="register">ثبت‌نام</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label>ایمیل</label>
                    <div class="input-icon">
                        <span>📧</span>
                        <input type="email" name="email" required placeholder="email@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>رمز عبور</label>
                    <div class="input-icon">
                        <span>🔒</span>
                        <input type="password" name="password" required placeholder="••••••••">
                        <button type="button" class="toggle-password">👁️</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" name="remember">
                        <span>مرا به خاطر بسپار</span>
                    </label>
                    <a href="/forgot-password" data-link>فراموشی رمز</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span class="btn-text">ورود به حساب</span>
                    <span class="btn-loading" style="display: none;">
                        <div class="spinner-small"></div>
                    </span>
                </button>

                <div class="auth-divider">
                    <span>یا</span>
                </div>

                <button type="button" class="btn btn-social google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    ورود با گوگل
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>نام کامل</label>
                    <div class="input-icon">
                        <span>👤</span>
                        <input type="text" name="name" required placeholder="نام و نام خانوادگی">
                    </div>
                </div>

                <div class="form-group">
                    <label>ایمیل</label>
                    <div class="input-icon">
                        <span>📧</span>
                        <input type="email" name="email" required placeholder="email@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>شماره موبایل</label>
                    <div class="input-icon">
                        <span>📱</span>
                        <input type="tel" name="phone" placeholder="09xxxxxxxxx">
                    </div>
                </div>

                <div class="form-group">
                    <label>رمز عبور</label>
                    <div class="input-icon">
                        <span>🔒</span>
                        <input type="password" name="password" required placeholder="حداقل ۸ کاراکتر" minlength="8">
                        <button type="button" class="toggle-password">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>تکرار رمز عبور</label>
                    <div class="input-icon">
                        <span>🔒</span>
                        <input type="password" name="confirmPassword" required placeholder="تکرار رمز عبور">
                    </div>
                </div>

                <label class="checkbox terms">
                    <input type="checkbox" name="terms" required>
                    <span><a href="/terms" data-link>قوانین و مقررات</a> را می‌پذیرم</span>
                </label>

                <button type="submit" class="btn btn-primary btn-block">
                    <span class="btn-text">ثبت‌نام</span>
                    <span class="btn-loading" style="display: none;">
                        <div class="spinner-small"></div>
                    </span>
                </button>
            </form>
        </div>

        <!-- Side Image -->
        <div class="auth-side">
            <div class="side-content">
                <div class="side-icon">🎯</div>
                <h2>به OdooMaster خوش آمدید</h2>
                <p>نصب هوشمند Odoo در کمتر از ۵ دقیقه</p>
                <ul class="features-list">
                    <li>✅ نصب آفلاین و سریع</li>
                    <li>✅ پشتیبانی فارسی</li>
                    <li>✅ ماژول‌های رایگان</li>
                    <li>✅ بروزرسانی خودکار</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<style>
    .auth-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px 20px 40px;
    }

    .auth-container {
        display: flex;
        width: 100%;
        max-width: 1000px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        overflow: hidden;
    }

    /* Auth Card */
    .auth-card {
        flex: 1;
        padding: 48px;
    }

    .auth-logo {
        text-align: center;
        margin-bottom: 32px;
    }

    .auth-logo .logo-icon {
        font-size: 48px;
        margin-bottom: 8px;
    }

    .auth-logo h1 {
        font-size: 28px;
        background: var(--gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    /* Tabs */
    .auth-tabs {
        display: flex;
        gap: 8px;
        background: rgba(0, 0, 0, 0.2);
        padding: 6px;
        border-radius: 12px;
        margin-bottom: 32px;
    }

    .tab-btn {
        flex: 1;
        padding: 12px;
        background: transparent;
        border: none;
        color: var(--gray);
        font-family: inherit;
        font-size: 15px;
        font-weight: 500;
        border-radius: 8px;
        cursor: pointer;
        transition: var(--transition);
    }

    .tab-btn.active {
        background: var(--primary);
        color: white;
    }

    /* Forms */
    .auth-form {
        display: none;
    }

    .auth-form.active {
        display: block;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        font-size: 14px;
    }

    .input-icon {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-icon > span:first-child {
        position: absolute;
        right: 14px;
        font-size: 18px;
        pointer-events: none;
    }

    .input-icon input {
        width: 100%;
        padding: 14px 44px 14px 44px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-family: inherit;
        font-size: 15px;
        transition: var(--transition);
    }

    .input-icon input:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.08);
    }

    .toggle-password {
        position: absolute;
        left: 14px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
        opacity: 0.6;
        transition: var(--transition);
    }

    .toggle-password:hover {
        opacity: 1;
    }

    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        font-size: 14px;
    }

    .form-options a {
        color: var(--primary);
        text-decoration: none;
    }

    .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .checkbox input {
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
    }

    .terms {
        margin-bottom: 24px;
    }

    .terms a {
        color: var(--primary);
        text-decoration: none;
    }

    .btn-block {
        width: 100%;
        padding: 16px;
        font-size: 16px;
    }

    .spinner-small {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Divider */
    .auth-divider {
        display: flex;
        align-items: center;
        margin: 24px 0;
        color: var(--gray);
        font-size: 14px;
    }

    .auth-divider::before,
    .auth-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
    }

    .auth-divider span {
        padding: 0 16px;
    }

    /* Social Login */
    .btn-social {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-family: inherit;
        font-size: 15px;
        cursor: pointer;
        transition: var(--transition);
    }

    .btn-social:hover {
        background: rgba(255, 255, 255, 0.1);
    }

    .btn-social img {
        width: 20px;
        height: 20px;
    }

    /* Side Panel */
    .auth-side {
        flex: 1;
        background: var(--gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px;
    }

    .side-content {
        text-align: center;
    }

    .side-icon {
        font-size: 64px;
        margin-bottom: 24px;
    }

    .side-content h2 {
        font-size: 28px;
        margin-bottom: 12px;
    }

    .side-content > p {
        opacity: 0.9;
        margin-bottom: 32px;
    }

    .features-list {
        list-style: none;
        text-align: right;
    }

    .features-list li {
        padding: 8px 0;
        font-size: 15px;
    }

    @media (max-width: 768px) {
        .auth-container {
            flex-direction: column;
        }

        .auth-side {
            display: none;
        }

        .auth-card {
            padding: 32px 24px;
        }
    }
</style>

<script>
(function() {
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            btn.classList.add('active');
            const tab = btn.dataset.tab;
            document.getElementById(tab + 'Form').classList.add('active');
        });
    });

    // Toggle password visibility
    document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
            const input = btn.parentElement.querySelector('input');
            input.type = input.type === 'password' ? 'text' : 'password';
            btn.textContent = input.type === 'password' ? '👁️' : '🙈';
        });
    });

    // Login form
    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const btn = form.querySelector('button[type="submit"]');
        const formData = new FormData(form);

        btn.disabled = true;
        btn.querySelector('.btn-text').style.display = 'none';
        btn.querySelector('.btn-loading').style.display = 'flex';

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: formData.get('email'),
                    password: formData.get('password')
                })
            });

            const data = await res.json();
            
            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                App.toast('ورود موفق! خوش آمدید 👋', 'success');
                
                // Update header
                App.updateAuthUI();
                
                // Redirect
                setTimeout(() => {
                    App.navigate('/dashboard');
                }, 500);
            } else {
                App.toast(data.message || 'خطا در ورود', 'error');
            }
        } catch (err) {
            App.toast('خطا در ارتباط با سرور', 'error');
        } finally {
            btn.disabled = false;
            btn.querySelector('.btn-text').style.display = 'block';
            btn.querySelector('.btn-loading').style.display = 'none';
        }
    });

    // Register form
    document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;
        const btn = form.querySelector('button[type="submit"]');
        const formData = new FormData(form);

        // Validate passwords match
        if (formData.get('password') !== formData.get('confirmPassword')) {
            App.toast('رمز عبور و تکرار آن مطابقت ندارند', 'error');
            return;
        }

        btn.disabled = true;
        btn.querySelector('.btn-text').style.display = 'none';
        btn.querySelector('.btn-loading').style.display = 'flex';

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: formData.get('name'),
                    email: formData.get('email'),
                    phone: formData.get('phone'),
                    password: formData.get('password')
                })
            });

            const data = await res.json();
            
            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                App.toast('ثبت‌نام موفق! خوش آمدید 🎉', 'success');
                App.updateAuthUI();
                
                setTimeout(() => {
                    App.navigate('/dashboard');
                }, 500);
            } else {
                App.toast(data.message || 'خطا در ثبت‌نام', 'error');
            }
        } catch (err) {
            App.toast('خطا در ارتباط با سرور', 'error');
        } finally {
            btn.disabled = false;
            btn.querySelector('.btn-text').style.display = 'block';
            btn.querySelector('.btn-loading').style.display = 'none';
        }
    });

    // Check if already logged in
    if (localStorage.getItem('token')) {
        App.navigate('/dashboard');
    }
})();
</script>
