<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لایسنس‌ها | OdooMaster</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/unified-nav.css?v=8">
    <script src="/js/nav-loader.js"></script>
</head>
<body>
    <div id="particles-js"></div>

    <!-- Navigation - Loaded Dynamically -->
    <div id="mainNav"></div>

    <main style="padding-top: 110px; min-height: 100vh;">
        <div class="container" style="max-width: 1000px;">
            <div class="section-header">
                <span class="section-badge"><i class="fas fa-key"></i> <span data-i18n="nav.licenses">لایسنس‌ها</span></span>
                <h1 class="section-title" data-i18n="licenses.title">مدیریت لایسنس‌ها</h1>
                <p class="section-desc" data-i18n="licenses.desc">لایسنس‌های فعال و تاریخ انقضا</p>
            </div>

            <div class="glass" style="padding: 28px; border-radius: var(--radius-xl);">
                <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom: 16px;">
                    <div style="color: var(--gray-light);" data-i18n="licenses.note">برای دانلود فایل‌ها، باید لایسنس غیر Trial فعال داشته باشید.</div>
                    <a href="payment.html" class="btn btn-primary"><i class="fas fa-shopping-cart"></i> <span data-i18n="licenses.buyLicense">خرید لایسنس</span></a>
                </div>

                <div id="licensesList" style="display:grid; gap: 14px;"></div>
            </div>
        </div>
    </main>

    <script src="js/particles.min.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script src="js/licenses.js"></script>
</body>
</html>
