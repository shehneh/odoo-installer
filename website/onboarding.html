<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>راه‌اندازی Odoo - OdooMaster</title>
    <link rel="stylesheet" href="/css/unified-nav.css?v=8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .hidden { display: none !important; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .onboarding-container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Progress Stepper */
        .stepper-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 40px;
            color: white;
        }

        .stepper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
        }

        .stepper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255,255,255,0.3);
            z-index: 0;
        }

        .stepper-progress {
            position: absolute;
            top: 20px;
            left: 0;
            height: 3px;
            background: white;
            z-index: 1;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            cursor: pointer;
            transition: all 0.3s;
        }

        .step:hover .step-circle {
            transform: scale(1.1);
        }

        .step-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            border: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .step.active .step-circle {
            background: white;
            color: #667eea;
            border-color: white;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .step.completed .step-circle {
            background: #48bb78;
            border-color: #48bb78;
        }

        .step.completed .step-circle::before {
            content: '✓';
            color: white;
        }

        .step-label {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.8;
            text-align: center;
            white-space: nowrap;
        }

        .step.active .step-label {
            opacity: 1;
            font-weight: 600;
        }

        /* Content Area */
        .content-area {
            padding: 40px 50px;
            min-height: 500px;
        }

        .step-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .step-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .step-title {
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .step-description {
            color: #718096;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-label .required {
            color: #e53e3e;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Quiz Options */
        .quiz-container-wrapper {
            margin-bottom: 40px;
        }

        .quiz-question-card {
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border-right: 5px solid #667eea;
        }

        .quiz-question-title {
            font-weight: 700;
            font-size: 18px;
            color: #2d3748;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
        }

        .optional-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            margin-right: 8px;
        }

        .conditional-question {
            border-right: 4px solid #667eea;
            background: linear-gradient(135deg, #667eea05 0%, #764ba205 100%);
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .quiz-option {
            padding: 18px;
            border: 3px solid #e2e8f0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: white;
            position: relative;
            overflow: hidden;
        }

        .quiz-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .quiz-option:hover::before {
            opacity: 1;
        }

        .quiz-option:hover {
            border-color: #667eea;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        .quiz-option.selected {
            border-color: #48bb78;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 30px rgba(72, 187, 120, 0.3);
        }

        .quiz-option.selected::before {
            opacity: 0;
        }

        .quiz-option-icon {
            font-size: 40px;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .quiz-option-text {
            font-weight: 700;
            font-size: 16px;
            position: relative;
            z-index: 1;
        }

        /* Module Grid */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .module-card {
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            position: relative;
        }

        .module-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
        }

        .module-card.selected {
            border-color: #48bb78;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }

        .module-card.installed {
            border-color: #cbd5e0;
            background: #f7fafc;
            opacity: 0.7;
            pointer-events: none;
        }

        .module-checkbox {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 24px;
            height: 24px;
            accent-color: #48bb78;
        }

        .module-help {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 28px;
            height: 28px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: help;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            z-index: 10;
        }

        .module-help:hover {
            background: #5568d3;
            transform: scale(1.15);
        }

        .module-card.selected .module-help {
            background: rgba(255,255,255,0.3);
        }

        .module-tooltip {
            position: absolute;
            bottom: 110%;
            right: 0;
            background: #2d3748;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            width: 280px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .module-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            right: 10px;
            border: 8px solid transparent;
            border-top-color: #2d3748;
        }

        .module-help:hover .module-tooltip {
            opacity: 1;
            visibility: visible;
            bottom: 120%;
        }

        .tooltip-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffd700;
        }

        .module-icon {
            font-size: 40px;
            margin-bottom: 12px;
            margin-top: 10px;
        }

        .module-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .module-description {
            font-size: 13px;
            opacity: 0.8;
        }

        .module-card.selected .module-description {
            opacity: 0.95;
        }

        .module-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        .badge-recommended {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-installed {
            background: #d1fae5;
            color: #065f46;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 2px solid #e2e8f0;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-outline {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Progress Overlay */
        .progress-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .progress-overlay.active {
            display: flex;
        }

        .progress-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .progress-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .progress-bar-container {
            background: #e2e8f0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #48bb78, #38a169);
            transition: width 0.5s ease;
            border-radius: 6px;
        }

        .progress-log {
            max-height: 300px;
            overflow-y: auto;
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            font-size: 14px;
        }

        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-icon {
            font-size: 18px;
        }

        .log-success {
            color: #48bb78;
        }

        .log-error {
            color: #e53e3e;
        }

        .log-pending {
            color: #667eea;
        }

        /* Success Screen */
        .success-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .success-icon {
            font-size: 80px;
            color: #48bb78;
            margin-bottom: 20px;
            animation: bounceIn 0.6s;
        }

        @keyframes bounceIn {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        .success-title {
            font-size: 32px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .success-description {
            font-size: 16px;
            color: #718096;
            margin-bottom: 30px;
        }

        .info-box {
            background: #f7fafc;
            border-right: 4px solid #667eea;
            padding: 20px;
            border-radius: 10px;
            text-align: right;
            margin-bottom: 25px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #4a5568;
        }

        .info-value {
            color: #2d3748;
            font-family: monospace;
        }

        @media (max-width: 768px) {
            .onboarding-container {
                margin: 20px auto;
            }

            .stepper-container {
                padding: 20px;
            }

            .step-label {
                font-size: 11px;
            }

            .content-area {
                padding: 30px 25px;
            }

            .step-title {
                font-size: 24px;
            }

            .modules-grid {
                grid-template-columns: 1fr;
            }

            .quiz-options {
                grid-template-columns: 1fr;
            }
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border-right: 4px solid #3b82f6;
        }

        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border-right: 4px solid #f59e0b;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-right: 4px solid #10b981;
        }

        /* Demo Data Styles */
        .demo-data-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .demo-section {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .demo-section:hover {
            border-color: #667eea;
        }

        .demo-section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            cursor: pointer;
        }

        .demo-checkbox {
            width: 22px;
            height: 22px;
            accent-color: #667eea;
        }

        .demo-section-title {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .demo-icon {
            font-size: 20px;
        }

        .demo-section-content {
            padding: 15px 20px;
            border-top: 1px solid #e2e8f0;
        }

        .demo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px dashed #e2e8f0;
        }

        .demo-item:last-child {
            border-bottom: none;
        }

        .demo-item-check {
            width: 18px;
            height: 18px;
            accent-color: #48bb78;
        }

        .demo-item label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            min-width: 100px;
            text-align: center;
        }

        .role-badge.warehouse {
            background: #fef3c7;
            color: #92400e;
        }

        .role-badge.accountant {
            background: #dbeafe;
            color: #1e40af;
        }

        .role-badge.sales {
            background: #d1fae5;
            color: #065f46;
        }

        .role-badge.manager {
            background: #e0e7ff;
            color: #3730a3;
        }

        .role-badge.hr {
            background: #fce7f3;
            color: #9d174d;
        }

        .user-details {
            color: #718096;
            font-size: 13px;
        }

        .demo-hint {
            color: #718096;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .product-preview, .customer-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .product-tag, .customer-tag {
            background: #edf2f7;
            color: #4a5568;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        /* Deployment Status */
        .deployment-status {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
        }

        .deployment-step {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: #f8fafc;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
        }

        .deployment-step.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea10 0%, #764ba210 100%);
        }

        .deployment-step.completed {
            border-color: #48bb78;
            background: #d1fae5;
        }

        .deployment-step.error {
            border-color: #e53e3e;
            background: #fed7d7;
        }

        .dep-icon {
            font-size: 24px;
        }

        .dep-text {
            font-weight: 500;
            color: #2d3748;
        }

        .deployment-complete {
            text-align: center;
            padding: 30px;
        }

        .deployment-complete h3 {
            color: #48bb78;
            margin: 15px 0 10px;
        }

        .deployment-complete p {
            color: #718096;
            margin-bottom: 20px;
        }

        .demo-users-info {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: right;
        }

        .demo-users-info h4 {
            margin-bottom: 15px;
            color: #2d3748;
        }

        .demo-user-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #e2e8f0;
        }

        .demo-user-row:last-child {
            border-bottom: none;
        }

        .demo-user-role {
            font-weight: 600;
        }

        .demo-user-login {
            font-family: monospace;
            color: #667eea;
        }
        
        .back-home {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 25px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .back-home:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
</head>
<body>
    <a href="/" class="back-home">🏠 برگشت به خانه</a>
    
    <div class="onboarding-container">
        <!-- Progress Stepper -->
        <div class="stepper-container">
            <div class="stepper">
                <div class="stepper-progress" id="stepperProgress"></div>
                <div class="step active" data-step="1">
                    <div class="step-circle">1</div>
                    <div class="step-label">اطلاعات شرکت</div>
                </div>
                <div class="step" data-step="2">
                    <div class="step-circle">2</div>
                    <div class="step-label">نیازسنجی</div>
                </div>
                <div class="step" data-step="3">
                    <div class="step-circle">3</div>
                    <div class="step-label">انتخاب ماژول</div>
                </div>
                <div class="step" data-step="4">
                    <div class="step-circle">4</div>
                    <div class="step-label">راه‌اندازی</div>
                </div>
                <div class="step" data-step="5">
                    <div class="step-circle">5</div>
                    <div class="step-label">داده نمونه</div>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Step 1: Company Info -->

                        userAuthMethod = result.user.auth_method || 'email';
                        
                        // Fill form fields with user data
                        document.getElementById('adminEmail').value = result.user.email || '';
                        document.getElementById('adminName').value = result.user.name || '';
                        document.getElementById('phoneNumber').value = result.user.phone || '';
                        
                        // Configure form based on auth method
                        if (userAuthMethod === 'phone') {
                            // Phone auth - phone is required, email is optional
                            document.getElementById('emailRequired').classList.add('hidden');
                            document.getElementById('phoneRequired').classList.remove('hidden');
                            
                            // Make phone readonly if verified
                            if (result.user.phone) {
                                document.getElementById('phoneNumber').setAttribute('readonly', 'readonly');
                                document.getElementById('phoneNumber').style.backgroundColor = '#f7fafc';
                            }
                        } else {
                            // Email auth - email is required, phone is optional
                            document.getElementById('emailRequired').classList.remove('hidden');
                            document.getElementById('phoneRequired').classList.add('hidden');
                            
                            // Make email readonly if verified (or from Google)

                                document.getElementById('adminEmail').setAttribute('readonly', 'readonly');
                                document.getElementById('adminEmail').style.backgroundColor = '#f7fafc';
                            }
                        }
                    }
                }
            } catch (error) {

        function shouldShowQuestion(question) {
            // If no showIf condition, always show
            if (!question.showIf) return true;

            // Check if showIf is array (multiple conditions)
            const conditions = Array.isArray(question.showIf) ? question.showIf : [question.showIf];
            
            // matchAny: true means OR logic (any condition matches)
            // matchAny: false or undefined means AND logic (all conditions must match)
            const matchAny = question.matchAny === true;

            if (matchAny) {
                // OR: Return true if ANY condition matches
                return conditions.some(condition => {
                    const [key, value] = Object.entries(condition)[0];
                    return quizAnswers[key] === value;
                });
            } else {
                // AND: Return true only if ALL conditions match
                return conditions.every(condition => {
                    const [key, value] = Object.entries(condition)[0];
                    return quizAnswers[key] === value;
                });
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = '';

            let visibleIndex = 0;
            quizQuestions.forEach((q, index) => {
                // Check if question should be shown based on previous answers
                if (!shouldShowQuestion(q)) {
                    return; // Skip this question
                }

                visibleIndex++;
                const questionCard = document.createElement('div');
                questionCard.className = 'quiz-question-card';
                if (q.showIf) {
                    questionCard.classList.add('conditional-question');
                }

                const questionTitle = document.createElement('div');
                questionTitle.className = 'quiz-question-title';
                const optionalBadge = q.showIf ? '<span class="optional-badge">اختیاری</span>' : '';
                questionTitle.innerHTML = `
                    <span class="question-number">${visibleIndex}</span>
                    <span>${q.question}</span>
                    ${optionalBadge}
                `;

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'quiz-options';

                q.options.forEach(opt => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'quiz-option';
                    
                    // Check if this option is selected
                    if (quizAnswers[q.id] === opt.value) {
                        optionDiv.classList.add('selected');
                    }
                    
                    optionDiv.innerHTML = `
                        <div class="quiz-option-icon">${opt.icon}</div>
                        <div class="quiz-option-text">${opt.label}</div>
                    `;
                    optionDiv.onclick = () => selectQuizOption(q.id, opt.value, optionDiv, optionsDiv, opt.modules);
                    optionsDiv.appendChild(optionDiv);
                });

                questionCard.appendChild(questionTitle);
                questionCard.appendChild(optionsDiv);
                container.appendChild(questionCard);
            });
        }

        function selectQuizOption(questionId, value, element, container, modules) {
            container.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            quizAnswers[questionId] = value;

            // Add recommended modules
            if (modules && value === 'yes') {
                modules.forEach(m => selectedModules.add(m));
            }

            // Re-render quiz to show/hide conditional questions
            renderQuiz();
        }

        function renderModules() {
            const grid = document.getElementById('modulesGrid');
            grid.innerHTML = '';

            // Group modules
            const essential = [];
            const recommended = [];
            const optional = [];

            Object.entries(moduleDefinitions).forEach(([key, module]) => {
                if (module.category === 'essential') {
                    essential.push({ key, ...module });
                } else if (selectedModules.has(key)) {
                    recommended.push({ key, ...module });
                } else {
                    optional.push({ key, ...module });
                }
            });

            // Render essential (always checked, disabled)
            essential.forEach(m => {
                grid.appendChild(createModuleCard(m, true, true));
            });

            // Render recommended
            recommended.forEach(m => {
                grid.appendChild(createModuleCard(m, true, false));
            });

            // Render optional
            optional.forEach(m => {
                grid.appendChild(createModuleCard(m, false, false));
            });
        }

        function createModuleCard(module, checked, disabled) {
            const card = document.createElement('div');
            card.className = 'module-card' + (checked ? ' selected' : '');
            if (disabled) card.classList.add('installed');

            card.innerHTML = `
                <input type="checkbox" class="module-checkbox" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
                <div class="module-help">
                    ?
                    <div class="module-tooltip">
                        <div class="tooltip-title">${module.name}</div>
                        <div>${module.fullDescription || module.description}</div>
                    </div>
                </div>
                <div class="module-icon">${module.icon}</div>
                <div class="module-name">${module.name}</div>
                <div class="module-description">${module.description}</div>
                ${checked && !disabled ? '<span class="module-badge badge-recommended">پیشنهادی</span>' : ''}
                ${disabled ? '<span class="module-badge badge-installed">ضروری</span>' : ''}
            `;

            if (!disabled) {
                const helpBtn = card.querySelector('.module-help');
                helpBtn.onclick = (e) => {
                    e.stopPropagation();
                };
                
                card.onclick = () => toggleModule(module.key, card);
            }

            return card;
        }

        function toggleModule(moduleKey, card) {
            const checkbox = card.querySelector('.module-checkbox');
            checkbox.checked = !checkbox.checked;

            if (checkbox.checked) {
                selectedModules.add(moduleKey);
                card.classList.add('selected');
            } else {
                selectedModules.delete(moduleKey);
                card.classList.remove('selected');
            }
        }

                renderModules();

        function previousStep() {
            currentStep--;
            updateStepper();
            showStep(currentStep);
        }

        function updateStepper() {
            const steps = document.querySelectorAll('.step');
            const progress = document.getElementById('stepperProgress');

            steps.forEach((step, index) => {
                const stepNum = index + 1;
                step.classList.remove('active', 'completed');

                if (stepNum < currentStep) {
                    step.classList.add('completed');
                } else if (stepNum === currentStep) {
                    step.classList.add('active');
                }
            });

            // Update progress bar
            const progressPercent = ((currentStep - 1) / (steps.length - 1)) * 100;
            progress.style.width = progressPercent + '%';
        }

        function showStep(step) {
            document.querySelectorAll('.step-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelector(`.step-content[data-step="${step}"]`).classList.add('active');
        }

        async function startDeployment() {
            // Prevent double-click
            if (deploymentStarted) {
                console.log('Deployment already in progress');
                return;
            }
            deploymentStarted = true;

            const overlay = document.getElementById('progressOverlay');
            const progressBar = document.getElementById('progressBar');
            const progressLog = document.getElementById('progressLog');

            overlay.classList.add('active');
            progressLog.innerHTML = '';

            try {
                // Step 1: Create tenant
                addLog('🔧 در حال ایجاد دیتابیس...', 'pending');
                progressBar.style.width = '20%';

                const companyName = document.getElementById('companyName').value.trim();
                const adminEmail = document.getElementById('adminEmail').value.trim();
                const adminName = document.getElementById('adminName').value.trim();
                const phoneNumber = document.getElementById('phoneNumber').value.trim();

                const tenantResponse = await fetch('/api/create-tenant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        company_name: companyName,
                        admin_email: adminEmail,
                        admin_name: adminName,
                        phone: phoneNumber
                    })
                });

                if (!tenantResponse.ok) {
                    const errorData = await tenantResponse.json();
                    throw new Error(errorData.message || 'خطا در ایجاد دیتابیس');
                }

                const responseData = await tenantResponse.json();
                console.log('API Response:', responseData);
                
                // Extract data from response
                if (responseData.success && responseData.data) {
                    tenantData = {
                        database: responseData.data.database_name,
                        email: responseData.data.admin_email,
                        password: responseData.data.admin_password,
                        company: responseData.data.company_name
                    };
                } else {
                    throw new Error('ساختار پاسخ API نامعتبر است');
                }
                
                console.log('Tenant created:', tenantData);
                
                // Validate credentials
                if (!tenantData.database || !tenantData.email || !tenantData.password) {
                    console.error('Missing tenant data:', tenantData);
                    throw new Error('اطلاعات دیتابیس ناقص است');
                }
                
                addLog('✅ دیتابیس ایجاد شد', 'success');
                progressBar.style.width = '40%';

                // Step 2: Install modules
                addLog('📦 در حال نصب ماژول‌ها...', 'pending');

                const modulesToInstall = Array.from(selectedModules);
                const installResponse = await fetch('/api/install-modules-stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        db_name: tenantData.database,
                        admin_email: tenantData.email,
                        admin_password: tenantData.password,
                        modules: modulesToInstall
                    })
                });

                const reader = installResponse.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.substring(6));

                            if (data.event === 'module_status') {
                                if (data.status === 'installed' || data.status === 'already-installed') {
                                    addLog(`✅ ${moduleDefinitions[data.module]?.name || data.module}: ${data.message}`, 'success');
                                } else if (data.status === 'failed') {
                                    addLog(`❌ ${moduleDefinitions[data.module]?.name || data.module}: خطا`, 'error');
                                }
                            } else if (data.event === 'progress') {
                                const percent = 40 + (data.current / data.total) * 50;
                                progressBar.style.width = percent + '%';
                            }
                        }
                    }
                }

                progressBar.style.width = '100%';
                addLog('🎉 همه ماژول‌ها نصب شدند', 'success');

                // Close overlay and move to step 5 (Demo Data)
                setTimeout(() => {
                    overlay.classList.remove('active');
                    currentStep = 5;
                    updateStepper();
                    showStep(5);
                }, 1500);

            } catch (error) {
                addLog('❌ خطا: ' + error.message, 'error');
                // Keep overlay open on error so user can see what happened
            }
        }

                        groups: ['hr.group_hr_manager'],  // Will fallback to base.group_user if not available
                        role: 'hr'
                    });
                }
            }

            const products = document.getElementById('createProducts')?.checked ? [
                { name: 'لپ‌تاپ ایسوس', price: 45000000, qty: 10 },
                { name: 'موبایل سامسونگ', price: 25000000, qty: 20 },
                { name: 'کیبورد بی‌سیم', price: 2500000, qty: 50 },
                { name: 'ماوس گیمینگ', price: 1500000, qty: 100 },
                { name: 'هدفون بلوتوثی', price: 3500000, qty: 30 }
            ] : [];

            const customers = document.getElementById('createCustomers')?.checked ? [
                { name: 'شرکت فناوری پارس', phone: '02188001122', email: 'info@parstech.ir', is_company: true },
                { name: 'آقای محمد رضایی', phone: '09121234567', email: 'rezaei@gmail.com', is_company: false },
                { name: 'خانم زهرا احمدی', phone: '09351234567', email: 'ahmadi@yahoo.com', is_company: false }
            ] : [];

            const suppliers = document.getElementById('createSuppliers')?.checked ? [
                { name: 'شرکت واردات تجهیزات آسیا', phone: '02144556677', email: 'info@asiatech.ir', is_company: true, supplier: true },
                { name: 'پخش عمده الکترونیک', phone: '02133445566', email: 'wholesale@elec.ir', is_company: true, supplier: true }
            ] : [];

            try {
                const response = await fetch('/api/create-demo-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        db_name: tenantData.database,
                        admin_email: tenantData.email,
                        admin_password: tenantData.password,
                        users: usersToCreate,
                        products: products,
                        customers: customers,
                        suppliers: suppliers
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    createdDemoUsers = usersToCreate;
                    showFinalSuccess();
                } else {
                    throw new Error(result.message || 'خطا در ایجاد داده‌ها');
                }

            } catch (error) {
                console.error('Demo data error:', error);
                alert('خطا در ایجاد داده‌های نمونه: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '✨ ایجاد داده‌های نمونه';
            }
        }

        function showFinalSuccess() {
            // Hide demo options, show success
            document.querySelector('.demo-data-options').style.display = 'none';
            document.querySelector('.demo-data-options + .action-buttons').style.display = 'none';

            const successInfo = document.getElementById('successInfo');
            successInfo.innerHTML = `
                <div class="info-row">
                    <span class="info-label">نام دیتابیس:</span>
                    <span class="info-value">${tenantData?.database || 'نامشخص'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">ایمیل مدیر:</span>
                    <span class="info-value">${tenantData?.email || 'نامشخص'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">رمز عبور:</span>
                    <span class="info-value">${tenantData?.password || 'نامشخص'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">تعداد ماژول نصب‌شده:</span>
                    <span class="info-value">${selectedModules.size} ماژول</span>
                </div>
            `;

            // Show demo users info if any were created
            if (createdDemoUsers.length > 0) {
                const demoUsersInfo = document.getElementById('demoUsersInfo');
                let usersHtml = '<h4>👥 کاربران نمونه ایجاد شده:</h4>';
                
                createdDemoUsers.forEach(user => {
                    usersHtml += `
                        <div class="demo-user-row">
                            <span class="demo-user-role">${user.name}</span>
                            <span class="demo-user-login">${user.login} / ${user.password}</span>
                        </div>
                    `;
                });
                
                demoUsersInfo.innerHTML = usersHtml;
                demoUsersInfo.style.display = 'block';
            }

            document.getElementById('successScreen').style.display = 'block';
        }

        function addLog(message, type) {
            const log = document.getElementById('progressLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';

            let icon = '⏳';
            let className = 'log-pending';

            if (type === 'success') {
                icon = '✅';
                className = 'log-success';
            } else if (type === 'error') {
                icon = '❌';
                className = 'log-error';
            }

            entry.innerHTML = `
                <span class="log-icon ${className}">${icon}</span>
                <span>${message}</span>
            `;

            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function loginToOdoo() {
            if (!tenantData) {
                alert('خطا: اطلاعات دیتابیس موجود نیست');
                return;
            }
            
            // Save to localStorage for profile page
            localStorage.setItem('tenantData', JSON.stringify({
                ...tenantData,
                demoUsers: createdDemoUsers
            }));
            
            const url = `/auto_login.html?db=${encodeURIComponent(tenantData.database)}&email=${encodeURIComponent(tenantData.email)}&password=${encodeURIComponent(tenantData.password)}`;
            window.open(url, '_blank');  // Open in new tab
        }
    </script>
</body>
</html>
