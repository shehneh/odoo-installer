<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب کاربری - OdooMaster</title>
    <link rel="stylesheet" href="/css/unified-nav.css?v=8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f7fafc;
            min-height: 100vh;
            padding-top: 70px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-container {
            max-width: 1000px;
            margin: 20px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 40px;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
        }

        .info-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .info-card h2 {
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed #e2e8f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #4a5568;
        }

        .info-value {
            color: #2d3748;
            font-family: monospace;
            direction: ltr;
            text-align: left;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 10px;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .user-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s;
        }

        .user-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .user-role {
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .user-login {
            font-size: 13px;
            color: #718096;
            margin-bottom: 4px;
        }

        .user-password {
            font-size: 13px;
            color: #718096;
            font-family: monospace;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation - loaded dynamically -->
    <div id="navHeader"></div>

    <div class="profile-container">
        <h1>👤 حساب کاربری</h1>
        <p class="subtitle">اطلاعات دیتابیس و کاربران شما</p>

        <div id="profileContent">
            <div class="empty-state">
                <div class="empty-state-icon">🔍</div>
                <p>در حال بارگذاری اطلاعات...</p>
            </div>
        </div>
    </div>

    <script src="/js/nav-loader.js"></script>
    <script>
        async function loadProfile() {
            // Try to get from URL parameters first (for redirects from onboarding)
            const urlParams = new URLSearchParams(window.location.search);
            const urlDb = urlParams.get('db');
            const urlEmail = urlParams.get('email');
            const urlPassword = urlParams.get('password');
            const urlCompany = urlParams.get('company');
            const urlAdminName = urlParams.get('admin_name');
            const urlCreatedAt = urlParams.get('created_at');
            const isExisting = urlParams.get('existing') === 'true';
            
            if (urlDb && urlEmail && urlPassword) {
                // Display data from URL
                const data = {
                    database: urlDb,
                    email: urlEmail,
                    password: urlPassword,
                    company: urlCompany || 'شرکت شما',
                    admin_name: urlAdminName,
                    created_at: urlCreatedAt,
                    demoUsers: []
                };
                
                // Save to localStorage for future use
                localStorage.setItem('tenantData', JSON.stringify(data));
                
                // Show existing user message if applicable
                if (isExisting) {
                    document.getElementById('profileContent').innerHTML = `
                        <div class="info-card" style="background: #e8f5e9; border: 2px solid #4caf50;">
                            <h2 style="color: #2e7d32;">ℹ️ شما قبلاً ثبت‌نام کرده‌اید</h2>
                            <p style="color: #1b5e20; margin-top: 10px;">
                                این ایمیل قبلاً در سیستم ثبت شده است. از اطلاعات زیر برای ورود استفاده کنید:
                            </p>
                        </div>
                    ` + generateProfileContent(data);
                } else {
                    displayProfile(data);
                }
                
                return;
            }
            
            // Try to get from localStorage
            const localData = localStorage.getItem('tenantData');
            
            if (localData) {
                const data = JSON.parse(localData);
                displayProfile(data);
                
                // Also try to fetch from server
                if (data.email) {
                    fetchFromServer(data.email);
                }
            } else {
                document.getElementById('profileContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>هیچ اطلاعاتی یافت نشد</p>
                        <p style="margin-top: 10px; font-size: 14px;">لطفاً ابتدا یک دیتابیس ایجاد کنید.</p>
                        <div class="action-buttons" style="justify-content: center; margin-top: 20px;">
                            <a href="/onboarding.html" class="btn btn-primary">🚀 ایجاد دیتابیس جدید</a>
                        </div>
                    </div>
                `;
            }
        }
        
        function generateProfileContent(data) {
            // Format date if available
            let formattedDate = '-';
            if (data.created_at) {
                try {
                    const date = new Date(data.created_at);
                    formattedDate = date.toLocaleDateString('fa-IR', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } catch {
                    formattedDate = data.created_at;
                }
            }
            
            return `
                <div class="info-card">
                    <h2>🗄️ اطلاعات دیتابیس</h2>
                    <div class="info-row">
                        <span class="info-label">نام شرکت:</span>
                        <span class="info-value">${data.company || 'نامشخص'}</span>
                    </div>
                    ${data.admin_name ? `
                    <div class="info-row">
                        <span class="info-label">نام مدیر:</span>
                        <span class="info-value">${data.admin_name}</span>
                    </div>
                    ` : ''}
                    <div class="info-row">
                        <span class="info-label">نام دیتابیس:</span>
                        <span class="info-value">
                            ${data.database}
                            <button class="copy-btn" onclick="copyToClipboard('${data.database}')">📋 کپی</button>
                        </span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">ایمیل مدیر:</span>
                        <span class="info-value">
                            ${data.email}
                            <button class="copy-btn" onclick="copyToClipboard('${data.email}')">📋 کپی</button>
                        </span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">رمز عبور:</span>
                        <span class="info-value">
                            <strong style="font-size: 18px; color: #667eea;">${data.password}</strong>
                            <button class="copy-btn" onclick="copyToClipboard('${data.password}')">📋 کپی</button>
                        </span>
                    </div>
                    ${data.created_at ? `
                    <div class="info-row">
                        <span class="info-label">تاریخ ایجاد:</span>
                        <span class="info-value">${formattedDate}</span>
                    </div>
                    ` : ''}
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="loginAsAdmin()">🎯 ورود به عنوان مدیر</button>
                </div>
            `;
        }

        async function fetchFromServer(email) {
            try {
                const response = await fetch(`/api/profile/${encodeURIComponent(email)}`);
                const result = await response.json();
                
                if (result.success) {
                    const data = {
                        database: result.customer.database_name,
                        email: result.customer.admin_email,
                        password: result.customer.admin_password,
                        company: result.customer.company_name,
                        demoUsers: result.demo_users.map(u => ({
                            name: u.name,
                            login: u.login,
                            password: u.password,
                            role: u.role
                        }))
                    };
                    
                    localStorage.setItem('tenantData', JSON.stringify(data));
                    displayProfile(data);
                }
            } catch (error) {
                console.error('Error fetching profile:', error);
            }
        }

        function displayProfile(data) {
            const content = `
                <div class="info-card">
                    <h2>🗄️ اطلاعات دیتابیس</h2>
                    <div class="info-row">
                        <span class="info-label">نام شرکت:</span>
                        <span class="info-value">${data.company || 'نامشخص'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">نام دیتابیس:</span>
                        <span class="info-value">
                            ${data.database}
                            <button class="copy-btn" onclick="copyToClipboard('${data.database}')">📋 کپی</button>
                        </span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">ایمیل مدیر:</span>
                        <span class="info-value">
                            ${data.email}
                            <button class="copy-btn" onclick="copyToClipboard('${data.email}')">📋 کپی</button>
                        </span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">رمز عبور:</span>
                        <span class="info-value">
                            ${data.password}
                            <button class="copy-btn" onclick="copyToClipboard('${data.password}')">📋 کپی</button>
                        </span>
                    </div>
                </div>

                ${data.demoUsers && data.demoUsers.length > 0 ? `
                <div class="info-card">
                    <h2>👥 کاربران نمونه</h2>
                    <div class="users-grid">
                        ${data.demoUsers.map(user => `
                            <div class="user-card">
                                <div class="user-role">${user.name}</div>
                                <div class="user-login">👤 ${user.login}</div>
                                <div class="user-password">🔑 ${user.password}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="loginAsAdmin()">🎯 ورود به عنوان مدیر</button>
                    ${data.demoUsers && data.demoUsers.length > 0 ? `
                        <button class="btn btn-primary" onclick="showUserSelector()">👥 ورود با کاربر دیگر</button>
                    ` : ''}
                </div>
            `;
            
            document.getElementById('profileContent').innerHTML = content;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ کپی شد!');
            });
        }

        function loginAsAdmin() {
            const data = JSON.parse(localStorage.getItem('tenantData'));
            const url = `/auto_login.html?db=${encodeURIComponent(data.database)}&email=${encodeURIComponent(data.email)}&password=${encodeURIComponent(data.password)}`;
            window.open(url, '_blank');
        }

        function showUserSelector() {
            const data = JSON.parse(localStorage.getItem('tenantData'));
            if (!data.demoUsers || data.demoUsers.length === 0) return;
            
            const userList = data.demoUsers.map((user, idx) => 
                `<button class="btn btn-primary" style="width: 100%; margin-bottom: 10px;" 
                    onclick="loginAsUser(${idx})">${user.name} (${user.login})</button>`
            ).join('');
            
            document.getElementById('profileContent').innerHTML += `
                <div class="info-card" style="margin-top: 20px;">
                    <h2>👥 انتخاب کاربر</h2>
                    ${userList}
                </div>
            `;
        }

        function loginAsUser(index) {
            const data = JSON.parse(localStorage.getItem('tenantData'));
            const user = data.demoUsers[index];
            const url = `/auto_login.html?db=${encodeURIComponent(data.database)}&email=${encodeURIComponent(user.login)}&password=${encodeURIComponent(user.password)}`;
            window.open(url, '_blank');
        }

        // Load on page load
        loadProfile();
    </script>
</body>
</html>
