<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام کاربر - OdooMaster</title>
    <link rel="stylesheet" href="/css/unified-nav.css?v=8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            font-size: 32px;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .register-header p {
            color: #718096;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Auth Method Toggle */
        .auth-method-toggle {
            display: flex;
            background: #f7fafc;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .auth-method-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            color: #718096;
            transition: all 0.3s;
        }

        .auth-method-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .auth-method-btn:hover:not(.active) {
            background: #edf2f7;
        }

        .btn-register {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-register:hover { transform: translateY(-2px); }
        .btn-register:disabled { opacity: 0.6; cursor: not-allowed; }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #718096;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover { text-decoration: underline; }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .alert-success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .alert-error { background: #fed7d7; color: #742a2a; border: 1px solid #fc8181; }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            padding: 0 15px;
            color: #a0aec0;
            font-size: 14px;
        }

        .btn-google {
            width: 100%;
            padding: 15px;
            background: white;
            color: #333;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-google:hover {
            background: #f7fafc;
            border-color: #4285f4;
        }

        .hidden { display: none !important; }

        .optional-label {
            color: #a0aec0;
            font-weight: normal;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>🚀 ثبت‌نام</h1>
            <p>ایجاد حساب کاربری جدید</p>
        </div>

        <div id="alertBox"></div>

        <!-- Google Login Button -->
        <a href="/auth/google" class="btn-google">
            <svg width="24" height="24" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            ثبت‌نام با حساب گوگل
        </a>

        <div class="divider">
            <span>یا</span>
        </div>

        <!-- Auth Method Toggle -->
        <div class="auth-method-toggle">
            <button type="button" class="auth-method-btn active" onclick="setAuthMethod('email')" id="emailMethodBtn">
                📧 ایمیل
            </button>
            <button type="button" class="auth-method-btn" onclick="setAuthMethod('phone')" id="phoneMethodBtn">
                📱 موبایل
            </button>
        </div>

        <form id="registerForm" autocomplete="off">
            <div class="form-group">
                <label>نام و نام خانوادگی *</label>
                <input type="text" id="fullName" name="fname" required placeholder="مثال: علی احمدی" autocomplete="off">
            </div>
            
            <!-- Email Field -->
            <div class="form-group" id="emailGroup">
                <label>ایمیل *</label>
                <input type="email" id="email" name="mail" placeholder="example@gmail.com" autocomplete="off">
            </div>
            
            <!-- Phone Field -->
            <div class="form-group" id="phoneGroup">
                <label>شماره موبایل <span class="optional-label">(اختیاری)</span></label>
                <input type="tel" id="phone" name="mobile" placeholder="09123456789" pattern="09\d{9}" autocomplete="off" dir="ltr">
            </div>
            
            <div class="form-group">
                <label>رمز عبور *</label>
                <input type="password" id="password" name="pwd1" required placeholder="حداقل 8 کاراکتر" minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>تکرار رمز عبور *</label>
                <input type="password" id="confirmPassword" name="pwd2" required autocomplete="new-password">
            </div>
            
            <input type="hidden" id="authMethod" value="email">
            
            <button type="submit" class="btn-register" id="submitBtn">ثبت‌نام</button>
        </form>

        <div class="login-link">
            قبلاً ثبت‌نام کرده‌اید؟ <a href="/user-login.html">ورود</a>
        </div>
    </div>

    <script>
        let currentAuthMethod = 'email';
        
        function setAuthMethod(method) {
            currentAuthMethod = method;
            document.getElementById('authMethod').value = method;
            
            // Toggle buttons
            document.getElementById('emailMethodBtn').classList.toggle('active', method === 'email');
            document.getElementById('phoneMethodBtn').classList.toggle('active', method === 'phone');
            
            // Toggle fields
            const emailGroup = document.getElementById('emailGroup');
            const phoneGroup = document.getElementById('phoneGroup');
            const emailInput = document.getElementById('email');
            const phoneInput = document.getElementById('phone');
            
            if (method === 'email') {
                emailGroup.querySelector('label').innerHTML = 'ایمیل *';
                phoneGroup.querySelector('label').innerHTML = 'شماره موبایل <span class="optional-label">(اختیاری)</span>';
                emailInput.required = true;
                phoneInput.required = false;
            } else {
                emailGroup.querySelector('label').innerHTML = 'ایمیل <span class="optional-label">(اختیاری)</span>';
                phoneGroup.querySelector('label').innerHTML = 'شماره موبایل *';
                emailInput.required = false;
                phoneInput.required = true;
            }
        }

        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, type = 'info') {
            alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const authMethod = document.getElementById('authMethod').value;

            // Validate based on auth method
            if (authMethod === 'email' && !email) {
                showAlert('لطفاً ایمیل خود را وارد کنید', 'error');
                return;
            }
            if (authMethod === 'phone' && !phone) {
                showAlert('لطفاً شماره موبایل خود را وارد کنید', 'error');
                return;
            }
            if (authMethod === 'phone' && !/^09\d{9}$/.test(phone)) {
                showAlert('شماره موبایل باید با 09 شروع شود و 11 رقم باشد', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('رمز عبور و تکرار آن یکسان نیستند', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '⏳ در حال ثبت‌نام...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        full_name: fullName, 
                        email: email || null, 
                        phone: phone || null, 
                        password,
                        auth_method: authMethod
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('✅ ' + result.message, 'success');
                    setTimeout(() => window.location.href = '/user-login.html?registered=1', 2000);
                } else {
                    showAlert('❌ ' + result.error, 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'ثبت‌نام';
                }
            } catch (error) {
                showAlert('خطا در اتصال به سرور', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'ثبت‌نام';
            }
        });
    </script>
</body>
</html>
